<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hermit frame badge</title>
    <style>
      @font-face {
        font-family: "CustomFont";
        src: url("../../fonts/Qilka-Bold.otf") format("opentype");
      }

      body {
        margin: 0;
        color: {{TEXT_COLOR}};
        font-weight: {{TEXT_STYLE}};
        line-height: 1.625;
        font-size: 60px;
      }

      .github-badge {
        font-family: "CustomFont", sans-serif;
        --panel-face: #808080;

        padding-top: 82px;
        position: relative;
      }

      .github-badge {
        display: flex;
        width: fit-content;
        box-sizing: border-box;
      }

      .badge-left-part {
        border-image: var(--frame-data) 192 16 192 239 fill / 192px 16px 192px
          239px repeat;
        padding: 43px 34px 46px 83px;
      }

      .badge-right-part {
        border-image: var(--frame-data) 192 235 192 30 fill / 192px 235px 192px
          30px repeat;
        padding: 43px 83px 46px 34px;
      }

      .ears {
        position: absolute;
        z-index: -1;
        height: 120px;
        left: 31px;
        top: 0px;
      }
    </style>
    <script src="../../lib/color.global.js"></script>
  </head>
  <body>
    <script type="module">
      import { Jimp } from "https://esm.sh/jimp@1.6.0";
      const DEFAULT_COLOR = "#7EC17E";

      function change_color(image, currentColor, newColor) {
        const current = new Color(currentColor).to("hsl").coords;
        const target = new Color(newColor).to("hsl").coords;

        // Hue difference
        let hue = target[0] - current[0];

        // Кратчайший путь по цветовому кругу
        if (hue > 180) hue -= 360;
        if (hue < -180) hue += 360;

        // Saturation и Lightness difference
        const saturation = target[1] - current[1];
        const lightness = target[2] - current[2];

        // Применяем изменения к изображению
        const operations = [{ apply: "hue", params: [hue] }];

        if (saturation > 0) {
          operations.push({
            apply: "saturate",
            params: [saturation],
          });
        } else if (saturation < 0) {
          operations.push({
            apply: "desaturate",
            params: [-saturation],
          });
        }

        if (lightness > 0) {
          operations.push({
            apply: "lighten",
            params: [lightness],
          });
        } else if (lightness < 0) {
          operations.push({
            apply: "darken",
            params: [-lightness],
          });
        }

        image.color(operations);

        return image;
      }

      const image = await Jimp.read("./garrison-cat-badge-frame.png");
      const ears_image = await Jimp.read("./garrison-cat-badge-ears.png");
      window.ears_image = ears_image;

      change_color(image, DEFAULT_COLOR, "{{COLOR}}");
      change_color(ears_image, DEFAULT_COLOR, "{{COLOR}}");

      async function generate_frame_part_data(var_id, rect) {
        const part = image.clone().crop({
          x: rect.x,
          y: rect.y,
          w: rect.width,
          h: rect.height,
        });

        let frame_data = await part.getBase64("image/png");
        document.documentElement.style.setProperty(
          var_id,
          `url("${frame_data}")`,
        );
      }

      await generate_frame_part_data(`--left-frame-data`, {
        x: 0,
        y: 0,
        width: 629,
        height: 422,
      });
      await generate_frame_part_data(`--right-frame-data`, {
        x: 629,
        y: 0,
        width: 651,
        height: 422,
      });

      const ears_data = await ears_image.getBase64("image/png");

      const ears = document.querySelector(".ears");
      ears.src = ears_data;
    </script>
    <div class="github-badge">
      <img class="ears" src="" />
      <div class="badge-left-part" style="--frame-data: var(--left-frame-data)">
        <span>{{LEFT}}</span>
      </div>
      <div
        class="badge-right-part"
        style="--frame-data: var(--right-frame-data)"
      >
        <span>{{RIGHT}}</span>
      </div>
    </div>
  </body>
</html>
