name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build and deploy (rollback: an older commit)'
        required: false
        default: master
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'master' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # playwright-core does not download browsers on install; render/golden
      # tests launch Chromium directly and fail on a bare GitHub runner.
      - run: pnpm --filter badge-generator-backend exec playwright-core install --with-deps chromium
      - run: pnpm nx run backend:test
      - run: pnpm nx run backend:build

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      caddy_image: ${{ steps.images.outputs.caddy_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'master' }}
      # GitHub expressions have no substring method.
      - name: Compute short SHA
        id: short_sha
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend-prod
          push: true
          tags: |
            ghcr.io/ashenhermit/hermit-badges-generator/backend:sha-${{ steps.short_sha.outputs.SHORT_SHA }}
            ghcr.io/ashenhermit/hermit-badges-generator/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: caddy-prod
          push: true
          tags: |
            ghcr.io/ashenhermit/hermit-badges-generator/caddy:sha-${{ steps.short_sha.outputs.SHORT_SHA }}
            ghcr.io/ashenhermit/hermit-badges-generator/caddy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export image tags
        id: images
        shell: bash
        env:
          SHORT_SHA: ${{ steps.short_sha.outputs.SHORT_SHA }}
        run: |
          echo "backend_image=ghcr.io/ashenhermit/hermit-badges-generator/backend:sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "caddy_image=ghcr.io/ashenhermit/hermit-badges-generator/caddy:sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: 158.255.6.45
      SSH_USER: root
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_PATH: /home/hermit-badges-generator
      PROD_ENV: ${{ secrets.PROD_ENV }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'master' }}

      - name: Set up SSH key
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

      # Fail before contacting the host: bad PROD_ENV must leave host state untouched.
      - name: Preflight deploy env locally
        shell: bash
        env:
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          CADDY_IMAGE: ${{ needs.build.outputs.caddy_image }}
        run: |
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          {
            printf '%s\n' "$PROD_ENV"
            printf 'BACKEND_IMAGE=%s\nCADDY_IMAGE=%s\n' "$BACKEND_IMAGE" "$CADDY_IMAGE"
          } | sed 's/\r$//' > "$tmpdir/.env"
          DEPLOY_PATH="$tmpdir" DEPLOY_SOURCE_ONLY=1 DRY_RUN=0 bash -c 'source scripts/deploy-remote.sh; validate_env'

      - name: Trust host key
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > "$HOME/.ssh/known_hosts"

      - name: Prepare deploy directory
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p -- '$DEPLOY_PATH' && test -d '$DEPLOY_PATH' && test -w '$DEPLOY_PATH'"

      - name: Write .env on host
        shell: bash
        env:
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          CADDY_IMAGE: ${{ needs.build.outputs.caddy_image }}
        run: |
          {
            printf '%s\n' "$PROD_ENV"
            printf 'BACKEND_IMAGE=%s\nCADDY_IMAGE=%s\n' "$BACKEND_IMAGE" "$CADDY_IMAGE"
          } | sed 's/\r$//' | ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "umask 077; cat > '$DEPLOY_PATH/.env'; chmod 600 '$DEPLOY_PATH/.env'"

      - name: Copy compose file
        shell: bash
        run: |
          scp -i "$HOME/.ssh/deploy_key" -P "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            docker-compose.prod.yml "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.prod.yml"

      - name: Run deploy on host
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref || 'master' }}
        run: |
          {
            printf 'export GHCR_USER=%q GHCR_TOKEN=%q REF=%q\n' "$GHCR_USER" "$GHCR_TOKEN" "$REF"
            cat scripts/deploy-remote.sh
          } | ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" 'bash -s'
